schema: paperclip/v1
company:
  requireBoardApprovalForNewAgents: true
agents:
  architect:
    role: ceo
    adapter:
      type: claude_local
      config:
        model: claude-opus-5-5
    inputs:
      env:
        GH_TOKEN:
          kind: secret
          requirement: optional
  developer:
    role: engineer
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-5-5
    inputs:
      env:
        GH_TOKEN:
          kind: secret
          requirement: optional
  reviewer:
    role: qa
    adapter:
      type: claude_local
      config:
        model: claude-opus-5-5
    inputs:
      env:
        GH_TOKEN:
          kind: secret
          requirement: optional
